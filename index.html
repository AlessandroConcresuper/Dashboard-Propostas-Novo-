<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Comercial | Concresuper</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- TEMA ESCURO --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0f1419; color: #fff; padding: 20px; line-height: 1.5; }
        :root { --bg: #0f1419; --card: #1a1f2e; --border: #2d3748; --yellow: #f7c948; --muted: #94a3b8; --header-bg: #252b3d; --hover: #222a3d; }

        /* --- HEADER --- */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 20px; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo-c { width: 42px; height: 42px; background: var(--yellow); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: #000; }
        .brand h1 { font-size: 20px; font-weight: 700; }
        .brand p { font-size: 13px; color: var(--muted); }
        .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .date-label { color: var(--muted); font-size: 14px; margin-right: 8px; }
        select, input[type="text"], input[type="date"] { background: var(--card); color: white; border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }

        /* --- KPIs --- */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .kpi-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .kpi-value { font-size: 28px; font-weight: 700; }
        .kpi-value.gold { color: var(--yellow); }

        /* --- SEÇÕES --- */
        .section-card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 25px; }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        /* --- FILTROS DA TABELA --- */
        .table-filters { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-filter { background: var(--yellow); color: #000; }
        .btn-clear { background: #334155; color: white; }
        .btn:hover { opacity: 0.85; }

        /* --- TABELA --- */
        .table-scroll { overflow-x: auto; max-height: 500px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
        thead th { background: var(--header-bg); color: var(--yellow); padding: 10px 8px; border: 1px solid var(--border); position: sticky; top: 0; z-index: 10; white-space: nowrap; }
        tbody td { padding: 8px; border: 1px solid var(--border); }
        .sticky-col { position: sticky; left: 0; background: #1e2536; text-align: left; font-weight: 600; z-index: 5; }
        tbody tr:hover td { background: var(--hover); }
        .row-total { background: #1e2536; font-weight: 700; color: var(--yellow); }
        .row-media { background: #161b28; font-weight: 600; color: #10b981; }

        /* --- GRÁFICOS --- */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .chart-card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); height: 350px; position: relative; }
        .chart-filter-overlay { position: absolute; top: 15px; right: 20px; z-index: 5; }
        .chart-filter-overlay select { font-size: 12px; padding: 5px 8px; }

        /* --- PÓDIO + RANKING --- */
        .ranking-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; margin-bottom: 25px; }
        .podium-box { display: flex; justify-content: center; align-items: flex-end; gap: 16px; padding: 40px 16px 16px; min-height: 300px; }
        .podium-item { display: flex; flex-direction: column; align-items: center; width: 100px; }
        .podium-name { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
        .podium-bar { width: 100%; border-radius: 8px 8px 0 0; display: flex; flex-direction: column; align-items: center; padding-top: 15px; font-weight: 700; }
        .p1 { height: 180px; background: linear-gradient(to top, #b8860b, #f7c948); color: #000; }
        .p2 { height: 140px; background: linear-gradient(to top, #6b7280, #cbd5e0); color: #000; }
        .p3 { height: 100px; background: linear-gradient(to top, #92400e, #d97706); color: #fff; }

        @media (max-width: 1024px) { .charts-grid, .ranking-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="brand">
            <div class="logo-c">C</div>
            <div>
                <h1>Dashboard Comercial</h1>
                <p>Concresuper · Matriz Operacional</p>
            </div>
        </div>
        <div class="header-controls">
            <span class="date-label">28 de Julho de 2026</span>
            <select id="headerMes">
                <option>Janeiro</option><option>Fevereiro</option><option>Março</option>
                <option>Abril</option><option>Maio</option><option>Junho</option>
                <option selected>Julho</option><option>Agosto</option><option>Setembro</option>
                <option>Outubro</option><option>Novembro</option><option>Dezembro</option>
            </select>
            <select id="headerDia">
                <option selected>Todos os Dias</option>
            </select>
            <select id="headerVendedor">
                <option selected>Todos os Vendedores</option>
            </select>
        </div>
    </header>

    <!-- ==================== KPI CARDS ==================== -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-label">Total de Propostas</div>
            <div class="kpi-value" id="kpiTotal">303</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Média / Vendedor</div>
            <div class="kpi-value" id="kpiMediaVend">30,3</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Média / Dia</div>
            <div class="kpi-value" id="kpiMediaDia">6,0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Melhor Performance</div>
            <div class="kpi-value gold" id="kpiMelhor">Alex (55)</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Dias Úteis Restantes</div>
            <div class="kpi-value">4</div>
        </div>
    </div>

    <!-- ==================== TABELA ACOMPANHAMENTO ==================== -->
    <div class="section-card">
        <div class="section-title">📊 Acompanhamento Diário de Propostas</div>
        <div class="table-filters">
            <label style="color:var(--muted);font-size:13px;">Início:</label>
            <input type="date" id="dateStart" value="2026-07-01">
            <label style="color:var(--muted);font-size:13px;">Fim:</label>
            <input type="date" id="dateEnd" value="2026-07-31">
            <button class="btn btn-filter" onclick="filtrarTabela()">Filtrar Período</button>
            <button class="btn btn-clear" onclick="resetTabela()">Limpar</button>
        </div>
        <div class="table-scroll">
            <table id="mainTable">
                <thead>
                    <tr id="thr">
                        <th class="sticky-col">Vendedor</th>
                        <th>TOTAL</th>
                    </tr>
                </thead>
                <tbody id="tbr"></tbody>
                <tfoot id="tfr"></tfoot>
            </table>
        </div>
    </div>

    <!-- ==================== GRÁFICOS LINHA 1 ==================== -->
    <div class="charts-grid">
        <div class="chart-card">
            <canvas id="chartVolumeDiario"></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-filter-overlay">
                <select id="selectVendMeta" onchange="updateChartMeta()"></select>
            </div>
            <canvas id="chartMeta"></canvas>
        </div>
    </div>

    <!-- ==================== GRÁFICOS LINHA 2 ==================== -->
    <div class="charts-grid">
        <div class="chart-card">
            <canvas id="chartRosca"></canvas>
        </div>
        <div class="chart-card">
            <div class="chart-filter-overlay">
                <select id="selectVendBarra" onchange="updateChartBarra()">
                    <option value="Todos">Todos os Vendedores</option>
                </select>
            </div>
            <canvas id="chartBarras"></canvas>
        </div>
    </div>

    <!-- ==================== PÓDIO + RANKING ==================== -->
    <div class="ranking-grid">
        <div class="section-card" style="margin-bottom:0;">
            <div class="section-title">🏆 Classificação Geral</div>
            <div class="podium-box" id="podium"></div>
        </div>
        <div class="section-card" style="margin-bottom:0;">
            <div class="table-filters">
                <select id="rankFiltroVend" onchange="filtrarRanking()">
                    <option value="Todos">Filtrar Vendedor: Todos</option>
                </select>
                <input type="text" id="rankBusca" placeholder="🔍 Buscar vendedor..." oninput="filtrarRanking()">
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr><th>Pos</th><th style="text-align:left;">Vendedor</th><th>Total</th><th>Média/Dia</th></tr>
                    </thead>
                    <tbody id="rankBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        /* ============================================================
           🔧 DADOS — ALTERE AQUI OS VALORES REAIS DA PLANILHA
           ============================================================ */
        const NOMES = ["Alex", "Cesar", "Diego", "Diogo", "Eduardo", "Emerson", "Junior", "Lucas", "Marcelo", "Michel"];
        const TOTAIS_MOCK = [55, 28, 52, 22, 18, 12, 38, 2, 35, 41];
        const CORES = ['#f7c948','#3b82f6','#10b981','#f43f5e','#8b5cf6','#f97316','#06b6d4','#ec4899','#84cc16','#6366f1'];

        // Gera dias úteis de Julho/2026
        const diasJulho = [];
        for (let i = 1; i <= 31; i++) {
            const data = new Date(2026, 6, i);
            if (data.getDay() !== 0 && data.getDay() !== 6) {
                diasJulho.push({
                    dia: i,
                    formatado: i.toString().padStart(2, '0') + '/07',
                    full: `2026-07-${i.toString().padStart(2, '0')}`
                });
            }
        }

        // Distribui os totais aleatoriamente pelos dias úteis
        const matrizDados = NOMES.map((nome, idx) => {
            let total = TOTAIS_MOCK[idx];
            let dados = new Array(diasJulho.length).fill(0);
            for (let i = 0; i < total; i++) {
                dados[Math.floor(Math.random() * diasJulho.length)]++;
            }
            return { nome, dados, total };
        });

        /* ============================================================
           INICIALIZAÇÃO
           ============================================================ */
        window.onload = () => {
            popularSelects();
            renderTabela(diasJulho);
            initCharts();
            renderRanking(matrizDados);
            renderPodium();
        };

        function popularSelects() {
            // Dias no header
            const hDia = document.getElementById('headerDia');
            for (let i = 1; i <= 31; i++) hDia.innerHTML += `<option>Dia ${i}</option>`;

            // Vendedores nos selects
            const selects = [
                document.getElementById('headerVendedor'),
                document.getElementById('selectVendMeta'),
                document.getElementById('selectVendBarra'),
                document.getElementById('rankFiltroVend')
            ];
            selects.forEach((s, i) => {
                if (i === 1) s.innerHTML = ''; // Meta individual sem "Todos"
                NOMES.forEach(n => s.innerHTML += `<option value="${n}">${n}</option>`);
            });
        }

        /* ============================================================
           TABELA DE ACOMPANHAMENTO
           ============================================================ */
        function renderTabela(periodo) {
            const thr = document.getElementById('thr');
            const tbr = document.getElementById('tbr');
            const tfr = document.getElementById('tfr');

            // Cabeçalho
            thr.innerHTML = '<th class="sticky-col">Vendedor</th>';
            periodo.forEach(p => thr.innerHTML += `<th>${p.formatado}</th>`);
            thr.innerHTML += '<th>TOTAL</th>';

            // Corpo
            tbr.innerHTML = '';
            let totaisCol = new Array(periodo.length).fill(0);
            let ativosCol = new Array(periodo.length).fill(0);

            matrizDados.forEach(v => {
                let html = `<tr><td class="sticky-col">${v.nome}</td>`;
                let somaLinha = 0;
                periodo.forEach((p, idx) => {
                    const origIdx = diasJulho.findIndex(d => d.full === p.full);
                    const val = v.dados[origIdx] || 0;
                    html += `<td>${val}</td>`;
                    somaLinha += val;
                    totaisCol[idx] += val;
                    if (val > 0) ativosCol[idx]++;
                });
                html += `<td style="font-weight:bold;color:var(--yellow);">${somaLinha}</td></tr>`;
                tbr.innerHTML += html;
            });

            // Footer: TOTAL GERAL + MÉDIA
            let ft = `<tr class="row-total"><td class="sticky-col">TOTAL GERAL</td>`;
            const somaTotal = totaisCol.reduce((a, b) => a + b, 0);
            totaisCol.forEach(t => ft += `<td>${t}</td>`);
            ft += `<td>${somaTotal}</td></tr>`;

            ft += `<tr class="row-media"><td class="sticky-col">MÉDIA</td>`;
            totaisCol.forEach((t, i) => {
                const m = ativosCol[i] > 0 ? (t / ativosCol[i]).toFixed(1) : '0';
                ft += `<td>${m}</td>`;
            });
            ft += `<td>-</td></tr>`;
            tfr.innerHTML = ft;
        }

        function filtrarTabela() {
            const start = document.getElementById('dateStart').value;
            const end = document.getElementById('dateEnd').value;
            const filtrados = diasJulho.filter(d => d.full >= start && d.full <= end);
            renderTabela(filtrados);
        }

        function resetTabela() {
            document.getElementById('dateStart').value = '2026-07-01';
            document.getElementById('dateEnd').value = '2026-07-31';
            renderTabela(diasJulho);
        }

        /* ============================================================
           GRÁFICOS (CHART.JS)
           ============================================================ */
        let charts = {};

        function initCharts() {
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.borderColor = '#2d3748';

            const volData = diasJulho.map((_, i) =>
                matrizDados.reduce((acc, v) => acc + v.dados[i], 0)
            );

            // 1. Volume Diário
            charts.vol = new Chart(document.getElementById('chartVolumeDiario'), {
                type: 'line',
                data: {
                    labels: diasJulho.map(d => d.formatado),
                    datasets: [{
                        label: 'Propostas',
                        data: volData,
                        borderColor: '#f7c948',
                        backgroundColor: 'rgba(247, 201, 72, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: opts('📈 Volume Diário de Propostas Registradas')
            });

            // 2. Desempenho Individual vs Meta
            charts.meta = new Chart(document.getElementById('chartMeta'), {
                type: 'line',
                data: {
                    labels: diasJulho.map(d => d.formatado),
                    datasets: [
                        { label: 'Realizado', data: matrizDados[0].dados, borderColor: '#3b82f6', tension: 0.3, fill: true, backgroundColor: 'rgba(59,130,246,0.1)' },
                        { label: 'Meta Diária', data: Array(diasJulho.length).fill(5), borderColor: '#f43f5e', borderDash: [5,5], pointRadius: 0 }
                    ]
                },
                options: opts('🎯 Desempenho Individual: Alex vs Meta Diária')
            });

            // 3. Rosca
            charts.rosca = new Chart(document.getElementById('chartRosca'), {
                type: 'doughnut',
                data: {
                    labels: NOMES,
                    datasets: [{ data: TOTAIS_MOCK, backgroundColor: CORES, borderWidth: 0 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: '🍩 Distribuição de Propostas por Vendedor (%)', color: '#fff', font: { size: 14 } },
                        legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11 } } }
                    }
                }
            });

            // 4. Barras Comparativo
            charts.bar = new Chart(document.getElementById('chartBarras'), {
                type: 'bar',
                data: {
                    labels: NOMES,
                    datasets: [{ label: 'Propostas', data: TOTAIS_MOCK, backgroundColor: CORES, borderRadius: 5 }]
                },
                options: opts('📊 Comparativo de Propostas Entre Vendedores')
            });
        }

        function updateChartMeta() {
            const nome = document.getElementById('selectVendMeta').value;
            const vend = matrizDados.find(v => v.nome === nome);
            charts.meta.data.datasets[0].data = vend.dados;
            charts.meta.options.plugins.title.text = `🎯 Desempenho Individual: ${nome} vs Meta Diária`;
            charts.meta.update();
        }

        function updateChartBarra() {
            const val = document.getElementById('selectVendBarra').value;
            if (val === 'Todos') {
                charts.bar.data.labels = NOMES;
                charts.bar.data.datasets[0].data = TOTAIS_MOCK;
            } else {
                const vend = matrizDados.find(v => v.nome === val);
                charts.bar.data.labels = [val];
                charts.bar.data.datasets[0].data = [vend.total];
            }
            charts.bar.update();
        }

        function opts(title) {
            return {
                responsive: true, maintainAspectRatio: false,
                plugins: { title: { display: true, text: title, color: '#fff', font: { size: 14 } }, legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: '#2d3748' }, ticks: { color: '#94a3b8' } }, x: { grid: { display: false }, ticks: { color: '#94a3b8' } } }
            };
        }

        /* ============================================================
           RANKING E PÓDIO
           ============================================================ */
        function renderRanking(dados) {
            const rb = document.getElementById('rankBody');
            rb.innerHTML = '';
            const sorted = [...dados].sort((a, b) => b.total - a.total);
            sorted.forEach((v, i) => {
                rb.innerHTML += `<tr><td style="color:var(--yellow);font-weight:bold;">${i+1}º</td><td style="text-align:left;font-weight:600;">${v.nome}</td><td>${v.total}</td><td>${(v.total / diasJulho.length).toFixed(1)}</td></tr>`;
            });
        }

        function filtrarRanking() {
            const sel = document.getElementById('rankFiltroVend').value;
            const busca = document.getElementById('rankBusca').value.toLowerCase();
            const filtrados = matrizDados.filter(v =>
                (sel === 'Todos' || v.nome === sel) && v.nome.toLowerCase().includes(busca)
            );
            renderRanking(filtrados);
        }

        function renderPodium() {
            const sorted = [...matrizDados].sort((a, b) => b.total - a.total);
            const p = document.getElementById('podium');
            const items = [
                { v: sorted[1], c: 'p2', m: '🥈', pos: '2º' },
                { v: sorted[0], c: 'p1', m: '🥇', pos: '1º' },
                { v: sorted[2], c: 'p3', m: '🥉', pos: '3º' }
            ];
            p.innerHTML = items.map(i => `
                <div class="podium-item">
                    <div class="podium-name">${i.v.nome}</div>
                    <div class="podium-bar ${i.c}">
                        <div style="font-size:28px;">${i.m}</div>
                        <div style="font-size:22px;font-weight:700;">${i.v.total}</div>
                        <div style="font-size:12px;font-weight:400;">${i.pos}</div>
                    </div>
                </div>
            `).join('');
        }
    </script>

    <!--
    📌 INSTRUÇÕES DE ATUALIZAÇÃO:
    1. Altere TOTAIS_MOCK no início do <script> com os valores reais da planilha
    2. Para mudar o mês, altere new Date(2026, 6, i) — mês 6 = Julho
    3. Salve como index.html e suba no GitHub Pages
    -->
</body>
</html>

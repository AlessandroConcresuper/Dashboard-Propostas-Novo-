<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Comercial | Concresuper</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- TEMA ESCURO --- */
        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0f1419;
            color: #ffffff;
            padding: 20px;
            line-height: 1.5;
        }
        :root {
            --bg: #0f1419;
            --card: #1a1f2e;
            --muted: #94a3b8;
            --yellow: #f7c948;
            --border: #2d3748;
            --header-bg: #252b3d;
            --hover: #222a3d;
        }

        /* --- HEADER --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; flex-wrap: wrap; gap: 20px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo-c {
            width: 42px; height: 42px;
            background: var(--yellow); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 22px; color: #000;
        }
        .brand h1 { font-size: 20px; font-weight: 700; }
        .brand p { font-size: 13px; color: var(--muted); }
        .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .date { color: var(--muted); font-size: 14px; margin-right: 8px; }
        select, input[type="text"] {
            background: var(--card); color: white;
            border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 6px;
            font-size: 13px; outline: none;
        }

        /* --- KPI CARDS --- */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px; margin-bottom: 25px;
        }
        .kpi-card {
            background: var(--card);
            padding: 20px; border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .kpi-label {
            color: var(--muted); font-size: 11px;
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .kpi-value { font-size: 28px; font-weight: 700; }
        .kpi-value.gold { color: var(--yellow); }

        /* --- CARDS DE SEÇÃO --- */
        .section-card {
            background: var(--card);
            padding: 20px; border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 16px; font-weight: 600;
            margin-bottom: 15px;
            display: flex; align-items: center; gap: 8px;
        }

        /* --- TABELA --- */
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        thead th {
            background: var(--header-bg);
            color: var(--yellow);
            padding: 10px 8px;
            border: 1px solid var(--border);
            position: sticky; top: 0;
            white-space: nowrap;
            font-weight: 600;
        }
        tbody td { padding: 8px; border: 1px solid var(--border); }
        .sticky-col { position: sticky; left: 0; background: #1e2536; text-align: left; font-weight: 600; }
        tbody tr:hover td { background: var(--hover); }
        .row-total { background: #1e2536; font-weight: 700; color: var(--yellow); }

        /* --- GRÁFICOS --- */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px; margin-bottom: 25px;
        }
        .chart-card {
            background: var(--card);
            padding: 20px; border-radius: 8px;
            border: 1px solid var(--border);
            height: 320px;
        }

        /* --- PÓDIO + RANKING --- */
        .ranking-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 20px; margin-bottom: 25px;
        }
        .podium-box {
            display: flex; justify-content: center;
            align-items: flex-end; gap: 16px;
            padding: 30px 16px 16px;
            min-height: 280px;
        }
        .podium-item {
            display: flex; flex-direction: column;
            align-items: center; width: 100px;
        }
        .podium-name { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
        .podium-bar {
            width: 100%;
            border-radius: 8px 8px 0 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            padding-top: 16px;
            font-weight: 700;
        }
        .medal { font-size: 24px; margin-bottom: 4px; }
        .p1 { height: 160px; background: linear-gradient(to top, #b8860b, #f7c948); color: #000; }
        .p2 { height: 120px; background: linear-gradient(to top, #6b7280, #cbd5e0); color: #000; }
        .p3 { height: 90px; background: linear-gradient(to top, #92400e, #d97706); color: #fff; }
        .pos-text { font-size: 12px; font-weight: 400; }

        /* --- FILTROS DO RANKING --- */
        .filter-bar {
            display: flex; gap: 10px;
            margin-bottom: 15px; flex-wrap: wrap;
            align-items: center;
        }
        .filter-bar select { min-width: 180px; }
        .filter-bar input { flex: 1; min-width: 150px; }

        /* --- RESPONSIVO --- */
        @media (max-width: 1024px) {
            .charts-grid { grid-template-columns: 1fr; }
            .ranking-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .kpi-value { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="brand">
            <div class="logo-c">C</div>
            <div>
                <h1>Dashboard Comercial</h1>
                <p>Concresuper · Matriz Operacional</p>
            </div>
        </div>
        <div class="header-controls">
            <span class="date">27 de Julho de 2026</span>
            <select><option>Mês: Julho</option></select>
            <select><option>Dia: Todos</option></select>
            <select><option>Vendedor: Todos</option></select>
        </div>
    </header>

    <!-- ==================== KPI CARDS ==================== -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-label">Total de Propostas</div>
            <div class="kpi-value">303</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Média / Vendedor</div>
            <div class="kpi-value">30,3</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Média / Dia</div>
            <div class="kpi-value">6,0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Melhor Performance</div>
            <div class="kpi-value gold">Alex (55)</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Dias Úteis Restantes</div>
            <div class="kpi-value">4</div>
        </div>
    </div>

    <!-- ==================== TABELA PRINCIPAL ==================== -->
    <div class="section-card">
        <div class="section-title">📊 Acompanhamento Diário</div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr id="tableHeader">
                        <th class="sticky-col">Vendedor</th>
                        <!-- Dias inseridos via JS -->
                        <th>TOTAL</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ==================== GRÁFICOS ==================== -->
    <div class="charts-grid">
        <div class="chart-card"><canvas id="chartLinha1"></canvas></div>
        <div class="chart-card"><canvas id="chartLinha2"></canvas></div>
    </div>
    <div class="charts-grid">
        <div class="chart-card"><canvas id="chartRosca"></canvas></div>
        <div class="chart-card"><canvas id="chartBarras"></canvas></div>
    </div>

    <!-- ==================== PÓDIO + RANKING COM FILTROS ==================== -->
    <div class="ranking-grid">
        <!-- Pódio -->
        <div class="section-card" style="margin-bottom:0;">
            <div class="section-title">🏆 Classificação Geral</div>
            <div class="podium-box" id="podiumBox"></div>
        </div>
        <!-- Ranking com Filtros -->
        <div class="section-card ranking-table" style="margin-bottom:0;">
            <div class="section-title" style="visibility:hidden;">.</div>
            <div class="filter-bar">
                <select id="filterVendedor">
                    <option value="Todos">Filtrar Vendedor: Todos</option>
                </select>
                <select id="filterPeriodo">
                    <option value="mes">Período: Este Mês</option>
                    <option value="15">Período: Últimos 15 Dias</option>
                </select>
                <input type="text" id="searchVendedor" placeholder="🔍 Buscar vendedor...">
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th style="text-align:left;">Vendedor</th>
                            <th>Total</th>
                            <th>Média/Dia</th>
                        </tr>
                    </thead>
                    <tbody id="rankingBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        /* ============================================================
           🔧 DADOS — ALTERE AQUI
           ============================================================ */
        const vendedores = [
            { nome: 'Alex',    total: 55 },
            { nome: 'Diego',   total: 52 },
            { nome: 'Michel',  total: 41 },
            { nome: 'Junior',  total: 38 },
            { nome: 'Marcelo', total: 35 },
            { nome: 'Cesar',   total: 28 },
            { nome: 'Diogo',   total: 22 },
            { nome: 'Eduardo', total: 18 },
            { nome: 'Emerson', total: 12 },
            { nome: 'Lucas',   total: 2  }
        ];

        const diasUteis = [
            '01/07','02/07','03/07','06/07','07/07',
            '08/07','09/07','10/07','13/07','14/07',
            '15/07','16/07','17/07','20/07','21/07'
        ];

        const cores = ['#f7c948','#3b82f6','#10b981','#f43f5e','#8b5cf6',
                       '#f97316','#06b6d4','#ec4899','#84cc16','#6366f1'];

        /* ============================================================
           GERAR TABELA PRINCIPAL
           ============================================================ */
        const header = document.getElementById('tableHeader');
        const tbody = document.getElementById('tableBody');
        const totaisDia = new Array(diasUteis.length).fill(0);

        diasUteis.forEach(d => {
            const th = document.createElement('th');
            th.textContent = d;
            header.insertBefore(th, header.lastElementChild);
        });

        vendedores.forEach(v => {
            const tr = document.createElement('tr');
            let resto = v.total;
            const vals = [];
            for (let i = 0; i < diasUteis.length; i++) {
                if (i === diasUteis.length - 1) { vals.push(resto); break; }
                const max = Math.min(resto, Math.max(1, Math.ceil(v.total / diasUteis.length * 2)));
                const val = Math.floor(Math.random() * max);
                vals.push(val);
                resto -= val;
            }
            let html = `<td class="sticky-col">${v.nome}</td>`;
            vals.forEach((val, i) => {
                totaisDia[i] += val;
                html += `<td>${val}</td>`;
            });
            html += `<td style="font-weight:bold;color:var(--yellow);">${v.total}</td>`;
            tr.innerHTML = html;
            tbody.appendChild(tr);

            // Preencher filtro dropdown
            const opt = document.createElement('option');
            opt.value = v.nome;
            opt.textContent = v.nome;
            document.getElementById('filterVendedor').appendChild(opt);
        });

        // Linha total geral
        const trTotal = document.createElement('tr');
        trTotal.className = 'row-total';
        let h = `<td class="sticky-col">TOTAL GERAL</td>`;
        totaisDia.forEach(t => h += `<td>${t}</td>`);
        h += `<td>303</td>`;
        trTotal.innerHTML = h;
        tbody.appendChild(trTotal);

        /* ============================================================
           PÓDIO
           ============================================================ */
        const podium = document.getElementById('podiumBox');
        const top3 = [vendedores[1], vendedores[0], vendedores[2]];
        const classes = ['p2','p1','p3'];
        const medals = ['🥈','🥇','🥉'];
        top3.forEach((v, i) => {
            podium.innerHTML += `
                <div class="podium-item">
                    <div class="podium-name">${v.nome}</div>
                    <div class="podium-bar ${classes[i]}">
                        <div class="medal">${medals[i]}</div>
                        <div>${v.total}</div>
                        <div class="pos-text">${i === 1 ? '1º' : i === 0 ? '2º' : '3º'}</div>
                    </div>
                </div>
            `;
        });

        /* ============================================================
           RANKING COM FILTROS
           ============================================================ */
        function renderRanking(dados) {
            const body = document.getElementById('rankingBody');
            body.innerHTML = '';
            if (dados.length === 0) {
                body.innerHTML = '<tr><td colspan="4" style="padding:20px;color:var(--muted);">Nenhum vendedor encontrado</td></tr>';
                return;
            }
            dados.forEach((v, i) => {
                const media = (v.total / diasUteis.length).toFixed(1);
                body.innerHTML += `
                    <tr>
                        <td style="color:var(--yellow);font-weight:bold;">${i+1}º</td>
                        <td style="text-align:left;font-weight:600;">${v.nome}</td>
                        <td>${v.total}</td>
                        <td>${media}</td>
                    </tr>
                `;
            });
        }

        renderRanking(vendedores);

        function aplicarFiltros() {
            const selVendedor = document.getElementById('filterVendedor').value;
            const busca = document.getElementById('searchVendedor').value.toLowerCase();
            const filtrados = vendedores.filter(v => {
                const matchVendedor = selVendedor === 'Todos' || v.nome === selVendedor;
                const matchBusca = v.nome.toLowerCase().includes(busca);
                return matchVendedor && matchBusca;
            });
            renderRanking(filtrados);
        }

        document.getElementById('filterVendedor').addEventListener('change', aplicarFiltros);
        document.getElementById('searchVendedor').addEventListener('input', aplicarFiltros);

        /* ============================================================
           GRÁFICOS
           ============================================================ */
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = '#2d3748';

        new Chart(document.getElementById('chartLinha1'), {
            type: 'line',
            data: {
                labels: diasUteis,
                datasets: [{
                    label: 'Total de Propostas',
                    data: totaisDia,
                    borderColor: '#f7c948',
                    backgroundColor: 'rgba(247, 201, 72, 0.1)',
                    fill: true, tension: 0.4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false,
                plugins: { title: { display: true, text: '📈 Propostas por Dia', color: '#fff' } },
                scales: { y: { beginAtZero: true, grid: { color: '#2d3748' } }, x: { grid: { display: false } } } }
        });

        new Chart(document.getElementById('chartLinha2'), {
            type: 'line',
            data: {
                labels: diasUteis,
                datasets: [
                    { label: 'Alex', data: [4,5,3,6,4,5,2,4,5,3,4,2,3,2,3],
                      borderColor: '#3b82f6', tension: 0.3, fill: true,
                      backgroundColor: 'rgba(59,130,246,0.1)' },
                    { label: 'Meta (5/dia)', data: Array(15).fill(5),
                      borderColor: '#f43f5e', borderDash: [6,4], pointRadius: 0 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: false,
                plugins: { title: { display: true, text: '🎯 Individual: Alex vs Meta', color: '#fff' } },
                scales: { y: { beginAtZero: true, grid: { color: '#2d3748' } }, x: { grid: { display: false } } } }
        });

        new Chart(document.getElementById('chartRosca'), {
            type: 'doughnut',
            data: {
                labels: vendedores.map(v => v.nome),
                datasets: [{ data: vendedores.map(v => v.total), backgroundColor: cores, borderWidth: 0 }]
            },
            options: { responsive: true, maintainAspectRatio: false,
                plugins: { title: { display: true, text: '🍩 Distribuição de Propostas', color: '#fff' },
                           legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11 } } } } }
        });

        new Chart(document.getElementById('chartBarras'), {
            type: 'bar',
            data: {
                labels: vendedores.map(v => v.nome),
                datasets: [{ label: 'Total de Propostas', data: vendedores.map(v => v.total),
                             backgroundColor: cores, borderRadius: 4 }]
            },
            options: { responsive: true, maintainAspectRatio: false,
                plugins: { title: { display: true, text: '📊 Comparativo entre Vendedores', color: '#fff' },
                           legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: '#2d3748' } }, x: { grid: { display: false } } } }
        });
    </script>

    <!--
    📌 INSTRUÇÕES:
    1. Edite "vendedores" e "diasUteis" no início do <script> para atualizar os dados
    2. Salve como index.html
    3. GitHub Pages: push pra branch main e ative em Settings > Pages
    -->
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Comercial | Concresuper - Matriz Operacional</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0f1419;
            --card: #1a1f2e;
            --border: #2d3748;
            --yellow: #f7c948;
            --muted: #94a3b8;
            --header-table: #252b3d;
            --white: #ffffff;
            --green: #10b981;
            --hover: #222a3d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--white); padding: 20px; line-height: 1.5; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 20px; }
        .brand { display: flex; align-items: center; gap: 14px; }
        .logo-c { width: 45px; height: 45px; background: var(--yellow); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 24px; color: #000; }
        .brand h1 { font-size: 20px; font-weight: 700; }
        .brand p { font-size: 13px; color: var(--muted); }
        .header-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .current-date { color: var(--muted); font-size: 14px; margin-right: 10px; }
        select, input[type="date"], input[type="text"] { background: var(--card); color: white; border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; cursor: pointer; }
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--card); padding: 25px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .kpi-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .kpi-value { font-size: 36px; font-weight: 700; }
        .kpi-value.gold { color: var(--yellow); }
        .section-card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 25px; }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .filter-row { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-filter { background: var(--yellow); color: #000; }
        .btn-clear { background: #334155; color: white; }
        .btn:hover { opacity: 0.8; }
        .table-container { overflow-x: auto; max-height: 500px; border-radius: 4px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
        thead th { background: var(--header-table); color: var(--yellow); padding: 12px 8px; border: 1px solid var(--border); position: sticky; top: 0; z-index: 10; white-space: nowrap; }
        tbody td { padding: 10px 8px; border: 1px solid var(--border); }
        .sticky-col { position: sticky; left: 0; background: #1e2536; text-align: left; font-weight: 600; z-index: 5; min-width: 130px; }
        tbody tr:hover td { background: var(--hover); }
        .row-total { background: #1e2536; font-weight: 700; color: var(--yellow); }
        .row-media { background: #161b28; font-weight: 600; color: var(--green); }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .chart-card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); height: 380px; position: relative; }
        .chart-header-select { position: absolute; top: 15px; right: 20px; z-index: 5; }
        .ranking-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        .podium-box { display: flex; justify-content: center; align-items: flex-end; gap: 15px; padding: 40px 10px 20px; min-height: 320px; }
        .podium-item { display: flex; flex-direction: column; align-items: center; width: 110px; }
        .podium-name { font-weight: 600; font-size: 14px; margin-bottom: 10px; text-align: center; }
        .podium-bar { width: 100%; border-radius: 8px 8px 0 0; display: flex; flex-direction: column; align-items: center; padding-top: 15px; font-weight: 700; }
        .p1 { height: 200px; background: linear-gradient(to top, #b8860b, #f7c948); color: #000; }
        .p2 { height: 150px; background: linear-gradient(to top, #6b7280, #cbd5e0); color: #000; }
        .p3 { height: 110px; background: linear-gradient(to top, #92400e, #d97706); color: #fff; }
        .medal { font-size: 32px; margin-bottom: 5px; }
        @media (max-width: 1024px) { .charts-grid, .ranking-grid, .kpi-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="logo-c">C</div>
            <div>
                <h1>Dashboard Comercial</h1>
                <p>Concresuper · Matriz Operacional</p>
            </div>
        </div>
        <div class="header-controls">
            <span class="current-date" id="dataAtual"></span>
            <select id="headerMes" onchange="updateDashboard()">
                <option>Janeiro</option><option>Fevereiro</option><option>Março</option>
                <option>Abril</option><option>Maio</option><option>Junho</option>
                <option selected>Julho</option><option>Agosto</option><option>Setembro</option>
                <option>Outubro</option><option>Novembro</option><option>Dezembro</option>
            </select>
            <select id="headerDia" onchange="updateDashboard()">
                <option value="all" selected>Todos os Dias</option>
            </select>
            <select id="headerVendedor" onchange="updateDashboard()">
                <option value="all" selected>Todos os Vendedores</option>
            </select>
        </div>
    </header>
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-label">Total de Propostas</div>
            <div class="kpi-value" id="kpiTotal">0</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Melhor Performance</div>
            <div class="kpi-value gold" id="kpiMelhor">-</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Dias Úteis Restantes</div>
            <div class="kpi-value" id="kpiDiasUteis">4</div>
        </div>
    </div>
    <div class="section-card">
        <div class="section-title">📊 Acompanhamento Diário de Propostas</div>
        <div class="filter-row">
            <label style="color:var(--muted);font-size:13px;">Início:</label>
            <input type="date" id="dateStart" value="2026-07-01">
            <label style="color:var(--muted);font-size:13px;">Fim:</label>
            <input type="date" id="dateEnd" value="2026-07-31">
            <button class="btn btn-filter" onclick="updateDashboard()">Filtrar Período</button>
            <button class="btn btn-clear" onclick="resetPeriodo()">Limpar</button>
        </div>
        <div class="table-container">
            <table id="mainTable">
                <thead>
                    <tr id="tableHeadRow">
                        <th class="sticky-col">Vendedor</th>
                        <th>TOTAL</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFoot"></tfoot>
            </table>
        </div>
    </div>
    <div class="charts-grid">
        <div class="chart-card"><canvas id="chartVolumeDiario"></canvas></div>
        <div class="chart-card">
            <div class="chart-header-select">
                <select id="selectVendMeta" onchange="updateChartMeta()"></select>
            </div>
            <canvas id="chartMeta"></canvas>
        </div>
    </div>
    <div class="charts-grid">
        <div class="chart-card"><canvas id="chartRosca"></canvas></div>
        <div class="chart-card">
            <div class="chart-header-select">
                <select id="selectVendBarra" onchange="updateChartBarra()">
                    <option value="all">Todos os Vendedores</option>
                </select>
            </div>
            <canvas id="chartBarras"></canvas>
        </div>
    </div>
    <div class="ranking-grid">
        <div class="section-card" style="margin-bottom:0;">
            <div class="section-title">🏆 Classificação Geral</div>
            <div class="podium-box" id="podiumBox"></div>
        </div>
        <div class="section-card" style="margin-bottom:0;">
            <div class="filter-row">
                <select id="rankFiltroVend" onchange="renderRanking()">
                    <option value="all">Filtrar Vendedor: Todos</option>
                </select>
                <input type="text" id="rankBusca" placeholder="🔍 Buscar vendedor..." oninput="renderRanking()">
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Pos</th><th style="text-align:left;">Vendedor</th><th>Total</th><th>Média/Dia</th></tr></thead>
                    <tbody id="rankBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        // 
        // CARREGA DADOS DA PLANILHA XLSX DINAMICAMENTE
        // 
        const URL_PLANILHA = 'propostas.xlsx';
        let DADOS_PLANILHA = {};
        let DIAS_MES = [];
        let MES_ATUAL = 6; // Julho (0-index)
        let ANO_ATUAL = 2026;

        async function carregarDados() {
            try {
                const resp = await fetch(URL_PLANILHA + '?v=' + Date.now());
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const buffer = await resp.arrayBuffer();
                const workbook = XLSX.read(buffer, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: 0 });

                // Pega o mes/ano da linha de datas (linha 2, indice 1)
                if (rows.length > 1 && rows[1][1]) {
                    const dataRef = new Date(rows[1][1]);
                    if (!isNaN(dataRef.getTime())) {
                        MES_ATUAL = dataRef.getMonth();
                        ANO_ATUAL = dataRef.getFullYear();
                    }
                }

                // Gera DIAS_MES baseado no mes/ano da planilha
                const diasNoMes = new Date(ANO_ATUAL, MES_ATUAL + 1, 0).getDate();
                DIAS_MES = [];
                for (let i = 1; i &lt;= diasNoMes; i++) {
                    const data = new Date(ANO_ATUAL, MES_ATUAL, i);
                    DIAS_MES.push({
                        dia: i,
                        full: `${ANO_ATUAL}-${String(MES_ATUAL+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,
                        formatado: String(i).padStart(2,'0') + '/' + String(MES_ATUAL+1).padStart(2,'0'),
                        isUtil: data.getDay() !== 0 && data.getDay() !== 6
                    });
                }

                // Processa os dados: linha 2 em diante
                const dadosTemp = {};
                for (let i = 2; i &lt; rows.length; i++) {
                    const linha = rows[i];
                    if (!linha || !linha[0]) continue;
                    const nome = String(linha[0]).trim();
                    if (!nome || nome.toLowerCase() === 'data') continue;

                    const valores = [];
                    for (let j = 1; j &lt;= diasNoMes; j++) {
                        const val = linha[j];
                        if (typeof val === 'string') {
                            const v = val.trim();
                            valores.push(v === '' || v === '-' || v === '—' ? 0 : Number(v) || 0);
                        } else {
                            valores.push(Number(val) || 0);
                        }
                    }
                    dadosTemp[nome] = valores;
                }

                if (Object.keys(dadosTemp).length > 0) {
                    DADOS_PLANILHA = dadosTemp;
                }

                // Atualiza data no header
                document.getElementById('dataAtual').textContent =
                    `${diasNoMes} de ${['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][MES_ATUAL]} de ${ANO_ATUAL}`;

                // Atualiza selects de dia
                const hDia = document.getElementById('headerDia');
                hDia.innerHTML = '<option value="all" selected>Todos os Dias</option>';
                for (let i = 1; i &lt;= diasNoMes; i++) {
                    hDia.innerHTML += `<option value="${i}">${i}</option>`;
                }

                // Atualiza campos de data
                document.getElementById('dateStart').value =
                    `${ANO_ATUAL}-${String(MES_ATUAL+1).padStart(2,'0')}-01`;
                document.getElementById('dateEnd').value =
                    `${ANO_ATUAL}-${String(MES_ATUAL+1).padStart(2,'0')}-${String(diasNoMes).padStart(2,'0')}`;

                console.log(`Planilha carregada: ${Object.keys(DADOS_PLANILHA).length} vendedores, ${diasNoMes} dias`);
            } catch (err) {
                console.error('Erro ao carregar planilha:', err);
                // Fallback: 31 dias, dados vazios
                DIAS_MES = [];
                for (let i = 1; i &lt;= 31; i++) {
                    const data = new Date(2026, 6, i);
                    DIAS_MES.push({
                        dia: i,
                        full: `2026-07-${String(i).padStart(2,'0')}`,
                        formatado: String(i).padStart(2,'0') + '/07',
                        isUtil: data.getDay() !== 0 && data.getDay() !== 6
                    });
                }
                const nomes = ['Alex','Diego','Michel','Junior','Marcelo','Cesar','Diogo','Eduardo','Emerson','Lucas'];
                nomes.forEach(n => DADOS_PLANILHA[n] = new Array(31).fill(0));
                document.getElementById('dataAtual').textContent = '28 de Julho de 2026';
            }
        }

        const CORES = ['#f7c948','#3b82f6','#10b981','#f43f5e','#8b5cf6','#f97316','#06b6d4','#ec4899','#84cc16','#6366f1'];
        let charts = {};

        window.onload = async () => {
            await carregarDados();
            initSelects();
            initCharts();
            updateDashboard();
        };

        function initSelects() {
            document.querySelectorAll('#headerVendedor, #selectVendMeta, #selectVendBarra, #rankFiltroVend').forEach(s => {
                Object.keys(DADOS_PLANILHA).forEach(n => s.innerHTML += `<option value="${n}">${n}</option>`);
            });
        }

        function resetPeriodo() {
            const diasNoMes = DIAS_MES.length;
            document.getElementById('dateStart').value =
                `${ANO_ATUAL}-${String(MES_ATUAL+1).padStart(2,'0')}-01`;
            document.getElementById('dateEnd').value =
                `${ANO_ATUAL}-${String(MES_ATUAL+1).padStart(2,'0')}-${String(diasNoMes).padStart(2,'0')}`;
            updateDashboard();
        }

        function updateDashboard() {
            const fDia = document.getElementById('headerDia').value;
            const fVend = document.getElementById('headerVendedor').value;
            const dStart = document.getElementById('dateStart').value;
            const dEnd = document.getElementById('dateEnd').value;

            let dias = DIAS_MES.filter(d => d.full >= dStart && d.full &lt;= dEnd && d.isUtil);
            if (fDia !== 'all') dias = dias.filter(d => d.dia == fDia);

            let nomes = Object.keys(DADOS_PLANILHA);
            if (fVend !== 'all') nomes = [fVend];

            renderTabela(dias, nomes);
            updateKPIs();
            renderRanking();
            renderPodium();
            updateCharts(dias);
        }

        function updateKPIs() {
            let total = 0, melhorNome = '-', melhorValor = -1;
            Object.entries(DADOS_PLANILHA).forEach(([nome, propostas]) => {
                const soma = propostas.reduce((a, b) => a + b, 0);
                total += soma;
                if (soma > melhorValor) { melhorValor = soma; melhorNome = `${nome} (${soma})`; }
            });
            document.getElementById('kpiTotal').textContent = total;
            document.getElementById('kpiMelhor').textContent = total > 0 ? melhorNome : '-';

            // Dias uteis restantes
            const hoje = new Date();
            let restantes = 0;
            for (const d of DIAS_MES) {
                const data = new Date(ANO_ATUAL, MES_ATUAL, d.dia);
                if (data > hoje && d.isUtil) restantes++;
            }
            document.getElementById('kpiDiasUteis').textContent = restantes;
        }

        function renderTabela(dias, nomes) {
            const head = document.getElementById('tableHeadRow');
            const body = document.getElementById('tableBody');
            const foot = document.getElementById('tableFoot');
            head.innerHTML = '<th class="sticky-col">Vendedor</th>';
            dias.forEach(d => head.innerHTML += `<th>${d.formatado}</th>`);
            head.innerHTML += '<th>TOTAL</th>';

            body.innerHTML = '';
            let totaisPorDia = new Array(dias.length).fill(0), somaGeral = 0;

            nomes.forEach(nome => {
                const propostas = DADOS_PLANILHA[nome] || new Array(31).fill(0);
                let tr = `<tr><td class="sticky-col">${nome}</td>`, somaLinha = 0;
                dias.forEach((d, i) => {
                    const val = propostas[d.dia - 1] || 0;
                    tr += `<td>${val}</td>`;
                    somaLinha += val; totaisPorDia[i] += val;
                });
                tr += `<td style="font-weight:bold;color:var(--yellow);">${somaLinha}</td></tr>`;
                body.innerHTML += tr;
                somaGeral += somaLinha;
            });

            let ft = `<tr class="row-total"><td class="sticky-col">TOTAL GERAL</td>`;
            totaisPorDia.forEach(t => ft += `<td>${t}</td>`);
            ft += `<td>${somaGeral}</td></tr>`;
            ft += `<tr class="row-media"><td class="sticky-col">MÉDIA</td>`;
            totaisPorDia.forEach(t => ft += `<td>${nomes.length ? (t/nomes.length).toFixed(1) : 0}</td>`);
            ft += `<td>-</td></tr>`;
            foot.innerHTML = ft;
        }

        function renderRanking() {
            const filtro = document.getElementById('rankFiltroVend').value;
            const busca = document.getElementById('rankBusca').value.toLowerCase();
            const body = document.getElementById('rankBody');
            body.innerHTML = '';
            const diasUteis = DIAS_MES.filter(d => d.isUtil).length || 1;
            const lista = Object.entries(DADOS_PLANILHA).map(([nome, propostas]) => ({
                nome, total: propostas.reduce((a,b) => a+b, 0)
            })).filter(v => (filtro === 'all' || v.nome === filtro) && v.nome.toLowerCase().includes(busca))
              .sort((a, b) => b.total - a.total);

            lista.forEach((v, i) => {
                body.innerHTML += `<tr><td style="color:var(--yellow);font-weight:bold;">${i+1}º</td><td style="text-align:left;font-weight:600;">${v.nome}</td><td>${v.total}</td><td>${(v.total / diasUteis).toFixed(1)}</td></tr>`;
            });
        }

        function renderPodium() {
            const sorted = Object.entries(DADOS_PLANILHA)
                .map(([nome, propostas]) => ({ nome, total: propostas.reduce((a,b) => a+b, 0) }))
                .sort((a, b) => b.total - a.total);
            const box = document.getElementById('podiumBox');

            if (sorted.length === 0) {
                box.innerHTML = '<div style="color:var(--muted);padding:40px;">Sem dados para exibir</div>';
                return;
            }

            const p2 = sorted[1] || { nome: '-', total: 0 };
            const p1 = sorted[0] || { nome: '-', total: 0 };
            const p3 = sorted[2] || { nome: '-', total: 0 };

            box.innerHTML = [
                { v: p2, c: 'p2', m: '🥈' },
                { v: p1, c: 'p1', m: '🥇' },
                { v: p3, c: 'p3', m: '🥉' }
            ].map(item => `
                <div class="podium-item">
                    <div class="podium-name">${item.v.nome}</div>
                    <div class="podium-bar ${item.c}">
                        <div class="medal">${item.m}</div>
                        <div style="font-size:22px;">${item.v.total}</div>
                    </div>
                </div>
            `).join('');
        }

        function initCharts() {
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.borderColor = '#2d3748';
            charts.vol = new Chart(document.getElementById('chartVolumeDiario'), {
                type: 'line',
                data: { labels: [], datasets: [{ label: 'Propostas', data: [], borderColor: '#f7c948', backgroundColor: 'rgba(247,201,72,0.1)', fill: true, tension: 0.4 }] },
                options: chartOpts('📈 Volume Diário de Propostas Registradas')
            });
            charts.meta = new Chart(document.getElementById('chartMeta'), {
                type: 'line',
                data: { labels: [], datasets: [
                    { label: 'Realizado', data: [], borderColor: '#3b82f6', fill: true, backgroundColor: 'rgba(59,130,246,0.1)', tension: 0.3 },
                    { label: 'Meta (5/dia)', data: [], borderColor: '#f43f5e', borderDash: [5,5], pointRadius: 0 }
                ]},
                options: chartOpts('🎯 Desempenho Individual vs Meta Diária')
            });
            const nomes = Object.keys(DADOS_PLANILHA);
            const totais = nomes.map(n => DADOS_PLANILHA[n].reduce((a,b) => a+b, 0));
            charts.rosca = new Chart(document.getElementById('chartRosca'), {
                type: 'doughnut',
                data: { labels: nomes, datasets: [{ data: totais, backgroundColor: CORES, borderWidth: 0 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: '🍩 Distribuição de Propostas por Vendedor (%)', color: '#fff', font: { size: 14 } },
                        legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11 } } }
                    }
                }
            });
            charts.bar = new Chart(document.getElementById('chartBarras'), {
                type: 'bar',
                data: { labels: nomes, datasets: [{ label: 'Propostas', data: totais, backgroundColor: CORES, borderRadius: 4 }] },
                options: chartOpts('📊 Comparativo de Propostas Entre Vendedores')
            });
        }

        function updateCharts(dias) {
            charts.vol.data.labels = dias.map(d => d.formatado);
            charts.vol.data.datasets[0].data = dias.map(d => Object.values(DADOS_PLANILHA).reduce((acc, prop) => acc + (prop[d.dia - 1] || 0), 0));
            charts.vol.update();
            updateChartMeta();
        }

        function updateChartMeta() {
            const nome = document.getElementById('selectVendMeta').value || Object.keys(DADOS_PLANILHA)[0];
            if (!nome) return;
            const propostas = DADOS_PLANILHA[nome] || new Array(31).fill(0);
            const dStart = document.getElementById('dateStart').value;
            const dEnd = document.getElementById('dateEnd').value;
            const dias = DIAS_MES.filter(d => d.full >= dStart && d.full &lt;= dEnd && d.isUtil);
            charts.meta.data.labels = dias.map(d => d.formatado);
            charts.meta.data.datasets[0].data = dias.map(d => propostas[d.dia - 1] || 0);
            charts.meta.data.datasets[1].data = new Array(dias.length).fill(5);
            charts.meta.data.datasets[0].label = nome;
            charts.meta.options.plugins.title.text = `🎯 Desempenho Individual: ${nome} vs Meta Diária`;
            charts.meta.update();
        }

        function updateChartBarra() {
            const val = document.getElementById('selectVendBarra').value;
            if (val === 'all') {
                charts.bar.data.labels = Object.keys(DADOS_PLANILHA);
                charts.bar.data.datasets[0].data = Object.keys(DADOS_PLANILHA).map(n => DADOS_PLANILHA[n].reduce((a,b) => a+b, 0));
            } else {
                charts.bar.data.labels = [val];
                charts.bar.data.datasets[0].data = [DADOS_PLANILHA[val].reduce((a,b) => a+b, 0)];
            }
            charts.bar.update();
        }

        function chartOpts(title) {
            return {
                responsive: true, maintainAspectRatio: false,
                plugins: { title: { display: true, text: title, color: '#fff', font: { size: 14 } }, legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { color: '#2d3748' } }, x: { grid: { display: false } } }
            };
        }
    </script>
